[project]
name = "riftbound-sim"
version = "0.1.0"
description = "A simulation framework for Riftbound TCG matchups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3",
    "pydantic>=2.8.2",
    "sqlalchemy>=2.0.35",
    "anthropic>=0.103.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The reinforcement-learning / self-play training stack. Kept optional so the core
# engine stays light and fast; install on a (rented, GPU) training machine with:
#   uv sync --extra rl
# torch selects CUDA automatically when available (see riftbound/ai — CUDA-aware).
rl = [
    "torch>=2.2",
]

[project.scripts]
rbsim = "riftbound.cli.main:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
# no special config needed, this just keeps uv happy
