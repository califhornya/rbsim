<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allenatore Riftbound</title>
<style>
:root {
  --bg: #0d1014; --mat: #121a1f; --mat2: #0f1519; --panel: #161b21; --panel2: #1c232b;
  --line: #2a333d; --ink: #e9edf2; --muted: #8d97a5; --faint: #5d6672;
  --me: #2fbfac; --opp: #f08a3c; --gold: #f5c451; --act: #4ea6ff; --bad: #ff5d55; --good: #45d08f;
  --ch: clamp(60px, 12vh, 142px);           /* a card on the table: height */
  --cw: calc(var(--ch) * 0.716);              /* and width */
  --hh: clamp(84px, 15.5vh, 186px);           /* a card in hand: height */
  --side: 340px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); overflow: hidden;
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-columns: minmax(0, 1fr) var(--side); }
button { font: inherit; border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer;
  background: var(--act); color: #06121f; font-weight: 650; }
button.ghost { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); font-weight: 550; }
button.gold { background: var(--gold); color: #1d1503; }
button:disabled { opacity: .5; cursor: default; }
select, textarea { font: inherit; width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel2); color: var(--ink); }
textarea { min-height: 60px; resize: vertical; }
.muted { color: var(--muted); }

/* ---- the table ---------------------------------------------------------- */
.table { position: relative; height: 100vh; min-width: 0; padding: 4px 12px 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 50%, #17242a 0%, var(--mat) 45%, var(--mat2) 100%);
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto; gap: 6px; }
.band { display: flex; gap: 10px; align-items: stretch; min-height: calc(var(--ch) + 34px); }
.zone { position: relative; border: 1px solid rgba(255,255,255,.07); border-radius: 12px; padding: 18px 8px 6px;
  background: rgba(255,255,255,.025); display: flex; gap: 8px; align-items: center; }
.zone > .zl { position: absolute; top: 3px; left: 10px; font-size: 10.5px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--faint); font-weight: 650; white-space: nowrap; }
.zone.base { flex: 1; min-width: 0; }
.zone.me { border-color: color-mix(in srgb, var(--me) 28%, transparent); }
.zone.opp { border-color: color-mix(in srgb, var(--opp) 28%, transparent); }
.row { display: flex; align-items: center; min-width: 0; flex: 1; height: var(--ch); }
.row > .slot + .slot { margin-left: var(--gap, 6px); }

/* points and resources */
.score { width: 74px; flex: none; justify-content: center; flex-direction: column; gap: 2px; padding-top: 16px; }
.score .big { font-size: 30px; font-weight: 800; line-height: 1; }
.score .big small { font-size: 14px; color: var(--muted); font-weight: 600; }
.pips { display: grid; grid-template-columns: repeat(4, 9px); gap: 3px; margin-top: 4px; }
.pip { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.12); }
.me .pip.on { background: var(--me); } .opp .pip.on { background: var(--opp); }
.res { flex: none; width: 168px; flex-direction: column; align-items: stretch; gap: 4px; padding-top: 18px; }
.res .line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }
.res .energy { font-size: 18px; font-weight: 800; }
.dom { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 999px; font-size: 11.5px;
  font-weight: 700; color: #0b0d10; }
.dom.FURY { background: #e2574f; } .dom.CALM { background: #4fbf7f; } .dom.MIND { background: #4b93f2; }
.dom.BODY { background: #f0913e; } .dom.CHAOS { background: #a66ad8; } .dom.ORDER { background: #e3bb43; }
.runes { display: flex; gap: 4px; flex-wrap: wrap; }
.rune { position: relative; width: calc(var(--cw) * .42); height: calc(var(--ch) * .42); }
.rune .n { position: absolute; right: -4px; bottom: -4px; background: #000c; border-radius: 6px; padding: 0 4px;
  font-size: 11px; font-weight: 800; }

/* cards */
.slot { position: relative; flex: none; width: var(--cw); height: var(--ch); border-radius: 7px; transition: margin .15s; }
.slot.exhausted { width: var(--ch); }
.slot .rot { position: absolute; left: 50%; top: 50%; width: var(--cw); height: var(--ch); transform: translate(-50%, -50%); }
.slot.exhausted .rot { transform: translate(-50%, -50%) rotate(90deg); }
.face { width: 100%; height: 100%; border-radius: 7px; overflow: hidden; background: #222a33; position: relative;
  box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.face .ph { display: none; position: absolute; inset: 0; padding: 6px; flex-direction: column; gap: 3px;
  font-size: 11px; line-height: 1.2; background: linear-gradient(160deg, #2b3440, #1a2028); }
.face.noimg .ph { display: flex; }
.face .ph b { font-size: 11.5px; }
.slot.empty { border: 1.5px dashed rgba(255,255,255,.15); display: grid; place-items: center; text-align: center;
  font-size: 10.5px; color: var(--faint); padding: 4px; }
.slot .cnt { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); background: #000d; border-radius: 6px;
  padding: 0 6px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.unit .might { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); min-width: 26px; text-align: center;
  background: #10151b; border: 1.5px solid #c9d2dc; border-radius: 999px; font-weight: 800; font-size: 12.5px; padding: 0 5px; z-index: 2; }
.unit .might.up { border-color: var(--good); color: var(--good); }
.unit .might.down { border-color: var(--bad); color: var(--bad); }
.unit .dmg { position: absolute; right: -5px; top: -5px; background: var(--bad); color: #fff; border-radius: 999px;
  font-weight: 800; font-size: 11.5px; padding: 0 6px; z-index: 2; }
.unit .buff { position: absolute; left: -5px; top: -5px; background: var(--gold); color: #1d1503; border-radius: 999px;
  font-weight: 800; font-size: 11px; padding: 0 5px; z-index: 2; }
.unit .stun { position: absolute; inset: 30% -4px auto; text-align: center; background: #6d3bd6e6; color: #fff; font-size: 10px;
  font-weight: 800; letter-spacing: .04em; border-radius: 4px; z-index: 2; }
.unit .gearb { position: absolute; left: -5px; bottom: 10px; background: #2a333d; border: 1px solid #56616e; border-radius: 6px;
  font-size: 11px; padding: 0 4px; z-index: 2; }
.unit.opp .face { box-shadow: 0 0 0 2px color-mix(in srgb, var(--opp) 55%, transparent), 0 2px 6px rgba(0,0,0,.5); }
.unit.me .face { box-shadow: 0 0 0 2px color-mix(in srgb, var(--me) 55%, transparent), 0 2px 6px rgba(0,0,0,.5); }
.small { width: calc(var(--cw) * .62); height: calc(var(--ch) * .62); }

/* who can act, what the net suggests, what to choose */
[data-ref].can { cursor: pointer; }
[data-ref].can .face, .hand .card.can .face { box-shadow: 0 0 0 2px var(--act), 0 0 12px color-mix(in srgb, var(--act) 60%, transparent); }
[data-ref].sugg .face, .hand .card.sugg .face { box-shadow: 0 0 0 3px var(--gold), 0 0 18px color-mix(in srgb, var(--gold) 70%, transparent); }
.zone.sugg-dst, .bf.sugg-dst { outline: 2px dashed var(--gold); outline-offset: -2px; }
[data-ref].pick { cursor: pointer; }
[data-ref].pick .face { animation: pulse 1.1s ease-in-out infinite; }
.bf.pick { animation: pulsebox 1.1s ease-in-out infinite; cursor: pointer; }
[data-ref].mull-out .face { animation: none; box-shadow: 0 0 0 3px var(--bad); filter: grayscale(.7) brightness(.7); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px var(--gold), 0 0 6px var(--gold); } 50% { box-shadow: 0 0 0 3px var(--gold), 0 0 22px var(--gold); } }
@keyframes pulsebox { 0%,100% { box-shadow: inset 0 0 0 2px var(--gold); } 50% { box-shadow: inset 0 0 0 3px var(--gold), 0 0 18px var(--gold); } }
.badge-n { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #1d1503;
  border-radius: 999px; font-weight: 900; font-size: 12px; padding: 0 7px; z-index: 4; white-space: nowrap; box-shadow: 0 1px 4px #000a; }

/* opponent hand, my hand */
.opphand { display: flex; justify-content: center; align-items: flex-start; height: calc(var(--ch) * .38); overflow: hidden; gap: 0; }
.opphand .back { width: calc(var(--cw) * .55); height: calc(var(--ch) * .55); margin: 0 -6px; transform: translateY(-38%); }
.opphand .lbl { align-self: center; margin-left: 18px; font-size: 12px; color: var(--muted); }
.hand { position: relative; display: flex; justify-content: center; height: calc(var(--hh) * .8); }
.hand .card { position: relative; flex: none; width: calc(var(--hh) * .716); height: var(--hh); margin: 0 -8px;
  transform-origin: 50% 120%; transition: transform .14s ease, margin .14s; cursor: default; }
.hand .card:hover { transform: translateY(-26%) scale(1.06) !important; z-index: 10; }
.hand .card .face { border-radius: 9px; }
.hand .card.can { cursor: pointer; }
.hand .empty-hand { align-self: center; color: var(--faint); font-size: 12px; }

/* battlefields */
.bfs { display: grid; grid-template-columns: repeat(var(--nbf, 2), minmax(0, 1fr)); gap: 12px; min-height: 0; align-content: center; }
.bf { position: relative; border-radius: 14px; padding: 6px 8px; background: rgba(0,0,0,.18);
  border: 1px solid rgba(255,255,255,.08); display: grid; grid-template-rows: var(--ch) auto var(--ch); gap: 6px; }
.bf.c-me { border-color: color-mix(in srgb, var(--me) 55%, transparent); background: color-mix(in srgb, var(--me) 7%, rgba(0,0,0,.18)); }
.bf.c-opp { border-color: color-mix(in srgb, var(--opp) 55%, transparent); background: color-mix(in srgb, var(--opp) 7%, rgba(0,0,0,.18)); }
.bf.showdown { box-shadow: 0 0 0 2px var(--gold), 0 0 24px color-mix(in srgb, var(--gold) 35%, transparent); }
.bf .row { justify-content: center; }
.bfmid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.bfcard { width: calc(var(--ch) * 1.33); height: calc(var(--ch) * .95); }
.bfcard .face { border-radius: 6px; }
.bfinfo { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bfinfo.l { align-items: flex-end; text-align: right; }
.bfinfo .name { color: var(--ink); font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.ctrl { font-weight: 700; }
.ctrl.me { color: var(--me); } .ctrl.opp { color: var(--opp); }
.mt { font-weight: 700; } .mt.me { color: var(--me); } .mt.opp { color: var(--opp); }
.sd { color: var(--gold); font-weight: 800; letter-spacing: .05em; font-size: 11px; }
.bfx { display: flex; gap: 6px; align-items: center; }

/* arrows */
svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; overflow: visible; }

/* ---- the sidebar ---------------------------------------------------------- */
aside { background: var(--panel); border-left: 1px solid var(--line); height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; }
aside section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
aside h2 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.top { display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 15px; margin: 0; font-weight: 750; }
.pill { margin-left: auto; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--panel2); color: var(--muted); }
.pill.waiting { background: var(--gold); color: #1d1503; }
.pill.over { background: var(--good); color: #062014; }
.board-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 6px; }
.board-score .n { font-size: 30px; font-weight: 850; line-height: 1; }
.board-score .who { font-size: 12px; color: var(--muted); }
.n.me { color: var(--me); } .n.opp { color: var(--opp); }
.turnline { margin-top: 8px; text-align: center; font-weight: 650; }
.turnline .alert { display: block; margin-top: 4px; color: var(--gold); font-size: 12.5px; }
.coach .ctx { color: var(--muted); margin: 0 0 10px; }
.best { border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); background: color-mix(in srgb, var(--gold) 8%, transparent);
  border-radius: 12px; padding: 10px; display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.best .thumb { width: 58px; height: 81px; }
.best .what { font-weight: 700; font-size: 14.5px; }
.best .why { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.best button { margin-top: 8px; width: 100%; }
.alt { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; margin-top: 8px; }
.alt .t { flex: 1; font-size: 13px; }
.alt .t small { display: block; color: var(--muted); font-size: 11.5px; }
.nb { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #1d1503; font-weight: 900;
  display: grid; place-items: center; font-size: 12px; }
.or { margin: 14px 0 6px; font-weight: 700; }
.hint { font-size: 12.5px; color: var(--muted); }
.opt { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; margin-top: 6px; cursor: pointer; }
.opt:hover { border-color: var(--gold); }
.opt .t { flex: 1; }
.opt .tag { font-size: 11px; color: var(--muted); }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: transparent;
  border-radius: 50%; animation: sp 0.8s linear infinite; margin-right: 6px; vertical-align: -1px; }
@keyframes sp { to { transform: rotate(360deg); } }
.chain { display: flex; flex-direction: column; gap: 6px; }
.chain .it { display: flex; gap: 8px; align-items: center; }
.chain .it .small { width: 36px; height: 50px; }
.log { font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; }
.log .turn { margin-top: 8px; font-weight: 750; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.log .e { padding: 2px 0 2px 8px; border-left: 3px solid var(--faint); }
.log .e.me { border-color: var(--me); } .log .e.opp { border-color: var(--opp); } .log .e.sys { border-color: var(--gold); }
.log .e b { font-weight: 700; }
.log .e.me b { color: var(--me); } .log .e.opp b { color: var(--opp); }
details summary { cursor: pointer; color: var(--muted); font-weight: 650; }
.tech { max-height: 220px; overflow: auto; font: 11.5px/1.35 ui-monospace, Consolas, monospace; color: var(--muted); white-space: pre-wrap; margin-top: 6px; }
aside section.grow { flex: 1 1 0; min-height: 150px; overflow-y: auto; }

/* ---- floating things -------------------------------------------------------- */
.preview { position: fixed; z-index: 50; pointer-events: none; width: 250px; display: none;
  filter: drop-shadow(0 10px 24px rgba(0,0,0,.65)); }
.preview.wide { width: 360px; }
.preview .face { border-radius: 12px; height: auto; aspect-ratio: 0.716; }
.preview.wide .face { aspect-ratio: 1.396; }
.preview .info { margin-top: 6px; background: #0b0e12f2; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
.preview .info b { font-size: 13.5px; }
.preview .info .st { color: var(--gold); margin-top: 3px; }
.preview .gears { display: flex; gap: 6px; margin-top: 6px; }
.preview .gears .face { width: 90px; aspect-ratio: .716; }
.menu { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px;
  width: 300px; box-shadow: 0 12px 32px rgba(0,0,0,.6); }
.menu h3 { margin: 2px 4px 6px; font-size: 13.5px; }
.menu .mi { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; background: transparent; color: var(--ink);
  border: 1px solid var(--line); margin-top: 5px; font-weight: 550; }
.menu .mi:hover { border-color: var(--act); background: color-mix(in srgb, var(--act) 12%, transparent); }
.menu .mi .t { flex: 1; }
.menu .mi small { color: var(--gold); font-weight: 700; }
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(5,7,10,.62); display: grid; place-items: center; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; width: min(560px, 92vw);
  max-height: 86vh; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.modal h2 { margin: 0 0 10px; font-size: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
.result { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.result.won { color: var(--good); } .result.lost { color: var(--bad); }
.pile { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
.pile .face { aspect-ratio: .716; height: auto; }
</style>
</head>
<body>
<main class="table" id="table">
  <div class="opphand" id="opphand"></div>
  <div class="band" id="oppband"></div>
  <div class="bfs" id="bfs"></div>
  <div class="band" id="myband"></div>
  <div class="hand" id="hand"></div>
  <svg class="arrows" id="arrows"></svg>
</main>
<aside>
  <section>
    <div class="top"><h1>Allenatore Riftbound</h1><span id="status" class="pill">…</span></div>
  </section>
  <section id="score"></section>
  <section class="coach" id="coach"></section>
  <section id="chainbox" style="display:none"><h2>Sulla pila (si risolve dall'alto)</h2><div class="chain" id="chain"></div></section>
  <section class="grow"><h2>Cosa è successo</h2><div class="log" id="log"></div></section>
  <section>
    <details><summary>Segnala un problema</summary>
      <textarea id="note" placeholder="Es.: questa carta non dovrebbe poter fare…, la rete ha ignorato…" style="margin-top:8px"></textarea>
      <div style="display:flex; gap:8px; margin-top:6px; align-items:center">
        <button class="ghost" id="sendReport">Invia segnalazione</button><span id="reportOk" class="hint"></span>
      </div>
      <div class="hint" style="margin-top:4px">Salva la situazione di gioco attuale insieme alla tua nota.</div>
    </details>
  </section>
  <section>
    <details><summary>Registro tecnico (inglese)</summary><div class="tech" id="tech"></div></details>
  </section>
  <section id="gamebox"></section>
</aside>
<div class="preview" id="preview"></div>
<div id="menu"></div>
<div id="modal"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TYPES = { Unit: "Unità", Spell: "Magia", Gear: "Equipaggiamento", Champion: "Campione", Legend: "Leggenda",
  Battlefield: "Campo di battaglia", Rune: "Runa", Token: "Token", "Signature Spell": "Magia firma",
  "Signature Gear": "Equipaggiamento firma", "Signature Unit": "Unità firma" };
const KW = { ASSAULT: "ASSAULT", SHIELD: "SHIELD", TANK: "TANK", BACKLINE: "BACKLINE", DEFLECT: "DEFLECT",
  GANKING: "GANKING", TEMPORARY: "TEMPORARY (muore a fine turno)", HIDDEN: "HIDDEN" };
let S = null, lastKey = "", busy = false, focus = 0, pileOpen = null, setupOpen = false;
let mullSel = [];   // the hand cards the coach is sending back at the mulligan
const REF = {};          // data-ref -> what the preview shows

/* ---------- cards ---------- */
const card = (name) => (S && S.cards && S.cards[name]) || {};
function face(name, extra = "") {
  const c = card(name), src = c.img ? `/img/${c.img}.webp` : null;
  const ph = `<div class="ph"><b>${esc(name)}</b><span>${esc(TYPES[c.type] || c.type || "")}${c.cost != null ? " · costo " + c.cost : ""}</span>${c.might != null ? `<span>Might ${c.might}</span>` : ""}</div>`;
  return `<div class="face ${src ? "" : "noimg"} ${extra}">${src ? `<img src="${src}" alt="" draggable="false" onerror="this.parentNode.classList.add('noimg');this.remove()">` : ""}${ph}</div>`;
}
const back = () => `<div class="face"><img src="/img/back.webp" alt="" draggable="false" onerror="this.remove()"></div>`;

function unitSlot(u, ref, side) {
  const printed = card(u.name).might;
  const cls = printed == null ? "" : u.might > printed ? "up" : u.might < printed ? "down" : "";
  REF[ref] = { name: u.name, unit: u };
  return `<div class="slot unit ${side} ${u.ready ? "" : "exhausted"}" data-ref="${ref}">
    <div class="rot">${face(u.name)}</div>
    <span class="might ${cls}">${u.might}</span>
    ${u.damage ? `<span class="dmg">−${u.damage}</span>` : ""}
    ${u.buffed ? '<span class="buff">+1</span>' : ""}
    ${u.stunned ? '<span class="stun">STORDITA</span>' : ""}
    ${u.gear && u.gear.length ? `<span class="gearb">⚙${u.gear.length > 1 ? u.gear.length : ""}</span>` : ""}
  </div>`;
}
function cardSlot(name, ref, opts = {}) {
  if (ref) REF[ref] = { name, ...(opts.data || {}) };
  return `<div class="slot ${opts.cls || ""} ${opts.exhausted ? "exhausted" : ""}" ${ref ? `data-ref="${ref}"` : ""}>
    <div class="rot">${name ? face(name) : back()}</div>${opts.count != null ? `<span class="cnt">${opts.count}</span>` : ""}</div>`;
}
const emptySlot = (text, ref) => `<div class="slot empty" ${ref ? `data-ref="${ref}"` : ""}>${esc(text)}</div>`;

/* ---------- the board ---------- */
// Two battlefields with one name (both precons bring Threshold of the Gray): say which.
function bfName(o, i) {
  const bfs = o.battlefields, n = bfs[i].named;
  if (!n) return "Campo " + (i + 1);
  if (bfs.filter((b) => b.named === n).length < 2) return n;
  return bfs.length === 2 ? `${n} (${i === 0 ? "sinistra" : "destra"})` : `${n} (${i + 1}°)`;
}
function renderTable() {
  for (const k in REF) delete REF[k];
  const o = S.observation;
  if (!o) { ["#opphand", "#oppband", "#bfs", "#myband", "#hand"].forEach((s) => $(s).innerHTML = "");
    $("#bfs").innerHTML = '<div class="muted" style="grid-column:1/-1;text-align:center">Inizia una partita dal riquadro qui accanto.</div>'; return; }
  const me = o.viewer, them = me === "A" ? "B" : "A", b = S.board || { runes: { me: [], opp: [] }, chain: [], facedown_mine: {} };
  // opponent's hand: card backs
  $("#opphand").innerHTML = Array.from({ length: Math.min(o.opp_hand_count, 12) }, () => `<div class="back">${back()}</div>`).join("")
    + `<span class="lbl">Mano avversaria: ${o.opp_hand_count}</span>`;
  $("#oppband").innerHTML = band(o, b, "opp");
  $("#myband").innerHTML = band(o, b, "me");
  // battlefields
  const bfs = o.battlefields.map((bf, i) => {
    const mine = bf[me] || [], theirs = bf[them] || [];
    const ctrl = bf.controller == null ? `<span class="ctrl">${mine.length && theirs.length ? "Conteso" : "Libero"}</span>` : bf.controller === me
      ? '<span class="ctrl me">Lo controlli tu</span>' : '<span class="ctrl opp">Lo controlla l\'avversario</span>';
    // In a fight: the Might with ASSAULT (attacker) / SHIELD (defender).
    const f = b.fight && b.fight[String(i)];
    const sum = (l, who) => f ? f[who] : l.reduce((a, u) => a + (u.might || 0), 0);
    // Facedown cards here (two at Bandle Tree): the viewer sees only their own.
    const fd = (bf.facedowns || []).map((who, j) => cardSlot(who === me ? b.facedown_mine[`${i}:${j}`] : null,
      `facedown:${i}:${j}`, { cls: "small", data: { facedown: who === me ? "mine" : "theirs" } })).join("");
    const gm = (me === "A" ? bf.gear_A : bf.gear_B).map((g, j) => cardSlot(g, `gear:me:${i}:${j}`, { cls: "small" })).join("");
    const go = (me === "A" ? bf.gear_B : bf.gear_A).map((g, j) => cardSlot(g, `gear:opp:${i}:${j}`, { cls: "small" })).join("");
    if (bf.named) REF[`bfcard:${i}`] = { name: bf.named, wide: true };
    const moving = b.moving && b.moving.bf === i
      ? `<span class="sd">${b.moving.who === "me" ? "STAI SPOSTANDO QUI" : "L'AVVERSARIO SI STA SPOSTANDO QUI"}</span><span class="hint">lo showdown parte a spostamento finito</span>` : "";
    return `<div class="bf ${bf.controller == null ? "" : bf.controller === me ? "c-me" : "c-opp"} ${o.showdown_bf === i || moving ? "showdown" : ""}" data-ref="bf:${i}">
      <div class="row">${theirs.map((u, j) => unitSlot(u, `unit:opp:${i}:${j}`, "opp")).join("")}${go}</div>
      <div class="bfmid">
        <div class="bfinfo l"><span class="name">${esc(bfName(o, i))}</span>${ctrl}${o.showdown_bf === i ? '<span class="sd">SHOWDOWN IN CORSO</span>' : ""}${moving}</div>
        <div class="bfcard" data-ref="bfcard:${i}">${bf.named ? face(bf.named) : ""}</div>
        <div class="bfinfo"><span class="mt opp">Avversario ⚔ ${sum(theirs, "opp")}</span><span class="mt me">Tu ⚔ ${sum(mine, "me")}</span><div class="bfx">${fd}</div></div>
      </div>
      <div class="row">${mine.map((u, j) => unitSlot(u, `unit:me:${i}:${j}`, "me")).join("")}${gm}</div>
    </div>`;
  }).join("");
  $("#bfs").style.setProperty("--nbf", Math.max(1, o.battlefields.length));
  $("#bfs").innerHTML = bfs;
  // my hand, fanned
  const n = o.my_hand.length;
  $("#hand").innerHTML = n ? o.my_hand.map((name, i) => {
    REF[`hand:${i}`] = { name };
    const off = i - (n - 1) / 2;
    return `<div class="card" data-ref="hand:${i}" style="transform: rotate(${off * 3.2}deg) translateY(${Math.abs(off) * Math.abs(off) * 1.6}px)">${face(name)}</div>`;
  }).join("") : '<span class="empty-hand">Nessuna carta in mano</span>';
}

function band(o, b, who) {
  const m = who === "me", p = (k) => o[(m ? "my_" : "opp_") + k];
  const pts = p("points"), vs = o.victory_score;
  const score = `<div class="zone score ${who}"><span class="zl">Punti</span>
    <div class="big">${pts}<small>/${vs}</small></div>
    <div class="pips">${Array.from({ length: vs }, (_, k) => `<span class="pip ${k < pts ? "on" : ""}"></span>`).join("")}</div></div>`;
  const runes = (b.runes && b.runes[who]) || [];
  const byDom = {};
  runes.forEach((r) => byDom[r.domain] = (byDom[r.domain] || 0) + 1);
  const power = Object.entries(p("power") || {}).filter(([, v]) => v);
  const res = `<div class="zone res ${who}"><span class="zl">Risorse</span>
    <div class="line"><span class="energy">⚡ ${p("energy")}</span><span class="muted">energia</span>${p("xp") ? `<span class="muted">· XP ${p("xp")}</span>` : ""}</div>
    <div class="line">${power.length ? power.map(([d, v]) => `<span class="dom ${d}">${d[0] + d.slice(1).toLowerCase()} ${v}</span>`).join("") : '<span class="muted">Power 0</span>'}</div>
    <div class="runes" title="Rune in gioco">${Object.entries(byDom).map(([d, k]) => {
      const name = d[0] + d.slice(1).toLowerCase() + " Rune";
      REF[`rune:${who}:${d}`] = { name, runes: k };
      return `<div class="rune" data-ref="rune:${who}:${d}">${face(name)}<span class="n">×${k}</span></div>`; }).join("") || '<span class="muted">Nessuna runa</span>'}</div></div>`;
  const units = p("base_units") || [], gear = p("base_gear") || [];
  const base = `<div class="zone base ${who}" data-ref="base:${who}"><span class="zl">${m ? "La tua base" : "Base avversaria"}</span>
    <div class="row">${units.map((u, j) => unitSlot(u, `unit:${who}:base:${j}`, who)).join("")}${gear.map((g, j) => cardSlot(g, `gear:${who}:base:${j}`)).join("")}${units.length || gear.length ? "" : '<span class="muted" style="font-size:12px">vuota</span>'}</div></div>`;
  const legend = p("legend") ? cardSlot(p("legend"), `legend:${who}`, { exhausted: !p("legend_ready"), data: { legend: true, ready: p("legend_ready") } }) : emptySlot("Leggenda");
  const champ = p("champion") ? cardSlot(p("champion"), `champion:${who}`) : emptySlot("Campione già in gioco");
  const lz = `<div class="zone ${who}"><span class="zl">Leggenda · Campione</span>${legend}${champ}</div>`;
  const trash = p("trash") || [], banished = p("banished") || [];
  REF[`trash:${who}`] = { name: null, pile: "trash" };
  const piles = `<div class="zone ${who}"><span class="zl">Mazzo · Cimitero${banished.length ? " · Bandite" : ""}</span>
    ${cardSlot(null, `deck:${who}`, { count: p("deck_count"), data: { pile: "deck" } })}
    ${trash.length ? cardSlot(trash[trash.length - 1], `trash:${who}`, { count: trash.length, data: { pile: "trash" } }) : emptySlot("Cimitero vuoto", `trash:${who}`)}
    ${banished.length ? cardSlot(banished[banished.length - 1], `banished:${who}`, { count: banished.length, cls: "small", data: { pile: "banished" } }) : ""}</div>`;
  return m ? score + res + base + lz + piles : piles + lz + base + res + score;
}

/* squeeze crowded rows so every card stays on screen */
function squeeze() {
  document.querySelectorAll(".row").forEach((row) => {
    const slots = [...row.children].filter((c) => c.classList.contains("slot"));
    row.style.removeProperty("--gap");
    if (slots.length < 2) return;
    const need = slots.reduce((a, s) => a + s.offsetWidth, 0) + 6 * (slots.length - 1);
    const have = row.clientWidth;
    if (need > have) row.style.setProperty("--gap", `${Math.floor((have - need) / (slots.length - 1)) + 6}px`);
  });
  const hand = $("#hand"), cards = [...hand.querySelectorAll(".card")];
  if (cards.length > 1) {
    const w = cards[0].offsetWidth, have = hand.clientWidth - 20;
    const m = Math.min(-8, (have - w * cards.length) / (cards.length - 1) / 2);
    cards.forEach((c) => { c.style.marginLeft = c.style.marginRight = `${m}px`; });
  }
}

/* ---------- the decision: what can be clicked, what the net suggests ---------- */
function actionsBySrc() {
  const p = S.pending, out = {};
  if (!p || p.type !== "decision") return out;
  p.actions.forEach((a, i) => { if (a.src) (out[a.src] = out[a.src] || []).push(i); });
  return out;
}
function suggOf(i) { return (S.pending.suggestions || []).findIndex((s) => s.action === i); }
function pct(w) { const p = Math.round(w * 100); return p < 1 ? "meno dell'1%" : p > 99 ? "più del 99%" : p + "%"; }

function markTable() {
  const p = S.pending;
  document.querySelectorAll("[data-ref]").forEach((el) => el.classList.remove("can", "sugg", "pick", "sugg-dst", "mull-out"));
  document.querySelectorAll(".badge-n").forEach((el) => el.remove());
  if (!p || S.status !== "waiting") return;
  const badge = (el, text) => { if (el) el.insertAdjacentHTML("beforeend", `<span class="badge-n">${esc(text)}</span>`); };
  if (p.type === "decision") {
    const by = actionsBySrc();
    Object.keys(by).forEach((ref) => { const el = node(ref); if (el) el.classList.add("can"); });
    const bySrc = {};
    p.suggestions.forEach((s, k) => { const a = p.actions[s.action]; if (a.src) (bySrc[a.src] = bySrc[a.src] || []).push(k + 1); });
    Object.entries(bySrc).forEach(([ref, ks]) => { const el = node(ref); if (el) { el.classList.add("sugg"); badge(el, ks.join("·")); } });
    const s = p.suggestions[focus];
    if (s) { const a = p.actions[s.action], d = node(s.choice_ref || a.dst); if (d && (d.classList.contains("zone") || d.classList.contains("bf"))) d.classList.add("sugg-dst"); }
  } else if (p.type === "mulligan") {
    p.hand.forEach((c, i) => { const el = node(c.ref); if (!el) return;
      if (mullSel.includes(i)) { el.classList.add("mull-out"); badge(el, "rimanda"); } else el.classList.add("pick"); });
  } else if (p.type === "choice") {
    // Options that share a place on the table (cards in a pile) are picked in the sidebar.
    const uses = {};
    p.options.forEach((opt) => { if (opt.ref) uses[opt.ref] = (uses[opt.ref] || 0) + 1; });
    p.options.forEach((opt, k) => { const el = uses[opt.ref] === 1 && node(opt.ref); if (el) { el.classList.add("pick"); badge(el, String(k + 1)); } });
  }
}
const node = (ref) => ref ? document.querySelector(`[data-ref="${CSS.escape(ref)}"]`) : null;

function drawArrows() {
  const svg = $("#arrows"), p = S && S.pending;
  svg.innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f5c451"/></marker></defs>`;
  if (!p || p.type !== "decision" || S.status !== "waiting") return;
  const s = p.suggestions[focus]; if (!s) return;
  const a = p.actions[s.action];
  const from = node(a.src), to = node(s.choice_ref || a.dst);
  if (!from || !to || from === to) return;
  const t = $("#table").getBoundingClientRect(), r1 = from.getBoundingClientRect(), r2 = to.getBoundingClientRect();
  const x1 = r1.left + r1.width / 2 - t.left, y1 = r1.top + r1.height / 2 - t.top;
  let x2 = r2.left + r2.width / 2 - t.left, y2 = r2.top + r2.height / 2 - t.top;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  x2 -= dx / len * 14; y2 -= dy / len * 14;
  const bend = Math.min(90, len * 0.25), cx = (x1 + x2) / 2 - dy / len * bend, cy = (y1 + y2) / 2 + dx / len * bend;
  const d = `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
  svg.insertAdjacentHTML("beforeend", `<path d="${d}" stroke="#000" stroke-opacity=".55" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="${d}" stroke="#f5c451" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#ah)"/>
    <circle cx="${x1}" cy="${y1}" r="7" fill="#f5c451" stroke="#000" stroke-opacity=".5" stroke-width="2"/>`);
}

/* ---------- the sidebar ---------- */

  });
  const log = $("#log"); log.innerHTML = html || '<span class="muted">Ancora niente.</span>';
  log.parentElement.scrollTop = log.parentElement.scrollHeight;
  $("#tech").textContent = (S.log || []).join("\n");
  // game box

  $("#gamebox").innerHTML = !playing ? `<button id="newgame">Nuova partita</button>`
    : S.autoplay ? `${who}<div class="hint">${S.saving ? `La rete sta finendo la partita da sola. Le tue ${S.decisions} decisioni verranno salvate alla fine.` : "La rete sta finendo la partita da sola. Non verrà salvato niente."}</div>`
    : `${who}<div style="display:flex;flex-direction:column;gap:6px">
        <button class="ghost" id="forget" ${S.decisions ? "" : "disabled"}>Ho sbagliato l'ultima mossa: non usarla per allenare</button>
        <button class="ghost" id="finish">Fermati qui e salva</button>
        <button class="ghost" id="abandon" style="color:var(--muted)">Abbandona senza salvare</button></div>`;

    $("#finish").onclick = async () => { if (confirm(`La rete finirà la partita da sola, senza chiederti niente. Le tue ${S.decisions} decisioni fin qui verranno salvate con il risultato finale. Va bene?`)) await post("/api/finish", { save: true }); };

  }
}

function renderCoach() {
  const el = $("#coach"), p = S.pending;
  if (S.status === "idle" || S.status === "over") { el.innerHTML = '<h2>Allenatore</h2><p class="hint">Quando la partita è in corso, qui vedi il consiglio della rete e decidi tu.</p>'; return; }
  if (S.status !== "waiting" || !p) { el.innerHTML = `<h2>Allenatore</h2><p><span class="spin"></span>${esc(S.activity || "Si gioca…")}</p>`; return; }
  if (p.type === "choice") {
    el.innerHTML = `<h2>Scegli tu</h2><div class="what" style="font-weight:750;font-size:15px">${esc(p.question)}</div>
      ${p.source ? `<p class="ctx">Per: ${esc(p.source)}</p>` : ""}
      ${p.options.map((opt, k) => `<div class="opt" data-opt="${k}"><span class="nb">${k + 1}</span><span class="t">${esc(opt.text)}</span>${k === p.default ? '<span class="tag">scelta automatica</span>' : ""}</div>`).join("")}
      <p class="hint" style="margin-top:8px">${p.options.some((x) => x.ref) ? "Puoi anche cliccare sul tavolo la carta che lampeggia." : ""}</p>`;

      d.onmouseleave = () => { const n = node(ref); if (n) n.style.outline = ""; };

  }
  if (p.type === "notice") {

        <div class="why" style="white-space:pre-line">${esc(c.text || "")}</div></div></div>
      <button class="gold" style="width:100%;margin-top:8px" id="noticeOk">Continua</button>
      <label class="hint" style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="noticeQuiet"> Non fermarti più sulle magie dell'avversario in questa partita</label>`;
    $("#noticeOk").onclick = () => send({ ok: true, quiet: $("#noticeQuiet").checked });

  }
  if (p.type === "mulligan") {
    const [best, ...alts] = p.suggestions || [];

    el.innerHTML = `<h2>Mulligan</h2><p class="ctx">${esc(p.context || "")}</p>
      ${best ? `<div class="best"><div><div class="hint" style="color:var(--gold);font-weight:700">Il consiglio della rete</div>
        <div class="what">${esc(best.text)}</div><div class="why">Secondo la rete, così vinci circa il ${pct(best.win)} delle volte.</div>
        <button class="gold" data-sugg="0">Va bene, fai così</button></div></div>` : ""}
      ${alts.map((s, k) => `<div class="alt"><span class="nb">${k + 2}</span>
        <span class="t">${esc(s.text)}<small>Vinci circa il ${pct(s.win)}</small></span>
        <button class="ghost" data-sugg="${k + 1}">Fai questa</button></div>`).join("")}
      <div class="or">Oppure decidi tu</div>
      <p class="hint">Clicca sul tavolo fino a ${p.max} carte della tua mano da rimandare; riclicca per tenerle.</p>
      <button class="ghost" style="width:100%;margin-top:6px" id="mullgo">${esc(mine)}</button>`;
    el.querySelectorAll("[data-sugg]").forEach((b) => b.onclick = () => send({ suggestion: +b.dataset.sugg }));
    $("#mullgo").onclick = () => send({ return: mullSel.slice() });
    return;
  }
  const sg = p.suggestions || [], top = sg[0];
  const thumbOf = (s) => { const a = p.actions[s.action]; const r = a.src && REF[a.src]; return r && r.name ? `<div class="thumb">${face(r.name)}</div>` : '<div class="thumb"></div>'; };
  // PASS while moving units ends the move: its showdown starts, the turn goes on.
  const moving = S.board && S.board.moving && S.board.moving.who === "me" && p.point === "turn_action";
  const isPass = (s) => p.actions[s.action].kind === "PASS" && !moving;
  const sentence = (s) => isPass(s)
    ? (p.point === "turn_action" ? "La rete non farebbe altro in questo turno." : "La rete lascerebbe correre.")
    : `Secondo la rete, così vinci circa il ${pct(s.win)} delle volte.`;
  const pass = p.actions.findIndex((a) => a.kind === "PASS");
  const others = p.actions.map((a, i) => [a, i]).filter(([a]) => !a.src && a.kind !== "PASS");
  el.innerHTML = `<h2>Tocca a te</h2><p class="ctx">${esc(p.context || "")}</p>
    ${top ? `<div class="best" data-s="0">${thumbOf(top)}<div><div class="hint" style="color:var(--gold);font-weight:700">Il consiglio della rete</div>
      <div class="what">${esc(top.text)}</div><div class="why">${sentence(top)}</div>
      <button class="gold" data-sugg="0">Va bene, fai così</button></div></div>` : ""}
    ${sg.slice(1).map((s, k) => `<div class="alt" data-s="${k + 1}"><span class="nb">${k + 2}</span>
      <span class="t">${esc(s.text)}<small>${isPass(s) ? "Passare" : "Vinci circa il " + pct(s.win)}</small></span>
      <button class="ghost" data-sugg="${k + 1}">Fai questa</button></div>`).join("")}
    <div class="or">Oppure decidi tu</div>
    <p class="hint">Clicca una carta bordata di blu sul tavolo e scegli cosa farne. Il numero dorato indica le idee della rete.</p>
    ${pass >= 0 ? `<button class="ghost" style="width:100%;margin-top:6px" data-act="${pass}">${esc(p.actions[pass].text)}</button>` : ""}
    ${others.length ? `<details style="margin-top:8px"><summary>Altre mosse (${others.length})</summary>${others.map(([a, i]) =>
      `<div class="opt" data-act="${i}"><span class="t">${esc(a.text)}</span></div>`).join("")}</details>` : ""}`;
  el.querySelectorAll("[data-sugg]").forEach((b) => b.onclick = () => send({ suggestion: +b.dataset.sugg }));
  el.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => send({ action: +b.dataset.act }));
  el.querySelectorAll("[data-s]").forEach((d) => d.onmouseenter = () => { if (focus !== +d.dataset.s) { focus = +d.dataset.s; markTable(); drawArrows(); } });
}

/* ---------- clicking the table ---------- */
function closeMenu() { $("#menu").innerHTML = ""; }
function openMenu(ref, el) {
  const p = S.pending, by = actionsBySrc(), list = by[ref] || [], r = REF[ref] || {};
  const seen = new Set(), items = [];
  list.forEach((i) => { const t = p.actions[i].text; const k = suggOf(i);
    if (seen.has(t) && k < 0) return; seen.add(t); items.push({ i, t, k }); });
  if (r.pile && r.pile !== "deck") items.push({ look: r.pile, t: r.pile === "trash" ? "Guarda il cimitero" : "Guarda le carte bandite" });
  if (!items.length) return;
  const rect = el.getBoundingClientRect();
  hidePreview();
  $("#menu").innerHTML = `<div class="menu" id="menubox"><h3>${esc(r.name || (r.pile === "trash" ? "Cimitero" : ""))}</h3>${items.map((it, n) =>
    `<button class="mi" data-n="${n}"><span class="t">${esc(it.t)}</span>${it.k >= 0 ? `<small>idea n°${it.k + 1} della rete</small>` : ""}</button>`).join("")}
    <button class="mi" data-close="1" style="justify-content:center;color:var(--muted)">Annulla</button></div>`;
  const box = $("#menubox"), h = box.offsetHeight, w = box.offsetWidth;
  let top = rect.top > window.innerHeight / 2 ? rect.top - h - 8 : rect.bottom + 8;
  top = Math.max(8, Math.min(window.innerHeight - h - 8, top));
  const left = Math.max(8, Math.min(window.innerWidth - w - 8, rect.left + rect.width / 2 - w / 2));
  box.style.top = top + "px"; box.style.left = left + "px";
  box.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => {
    const it = items[+b.dataset.n]; closeMenu();
    if (it.look) { pileOpen = { who: ref.split(":")[1], pile: it.look }; renderModal(); } else send({ action: it.i });
  });
  box.querySelector("[data-close]").onclick = closeMenu;
}
document.addEventListener("click", (ev) => {
  if (ev.target.closest("#menubox") || ev.target.closest(".modal .box") || ev.target.closest("aside")) return;
  const el = ev.target.closest("[data-ref]");
  closeMenu();
  if (!el || !S) return;
  const ref = el.dataset.ref, p = S.pending;
  if (S.status === "waiting" && p && p.type === "mulligan") {
    const i = p.hand.findIndex((c) => c.ref === ref);
    if (i >= 0) {
      mullSel = mullSel.includes(i) ? mullSel.filter((x) => x !== i)
        : mullSel.length < p.max ? [...mullSel, i].sort((a, b) => a - b) : mullSel;
      renderCoach(); markTable();
    }
    return;
  }
  if (S.status === "waiting" && p && p.type === "choice") {
    // The clicked card, or the battlefield around it, may be the option.
    for (let n = el; n; n = n.parentElement && n.parentElement.closest("[data-ref]")) {
      const k = n.classList.contains("pick") ? p.options.findIndex((o) => o.ref === n.dataset.ref) : -1;
      if (k >= 0) { send({ option: k }); break; }
    }
    return;
  }
  const r = REF[ref] || {};
  if (S.status === "waiting" && p && p.type === "decision" && actionsBySrc()[ref]) { openMenu(ref, el); return; }
  if (r.pile && r.pile !== "deck") { pileOpen = { who: ref.split(":")[1], pile: r.pile }; renderModal(); }
});

/* ---------- hover preview ---------- */
function showPreview(el) {
  const ref = el.dataset.ref, r = REF[ref], pv = $("#preview");
  if (!r) return hidePreview();
  if (!r.name && !r.facedown) return hidePreview();
  const c = card(r.name), u = r.unit, lines = [];
  if (u) {
    const printed = c.might;
    lines.push(`Might adesso: <b>${u.might}</b>${printed != null && printed !== u.might ? ` (stampata ${printed})` : ""}`);
    if (u.damage) lines.push(`Danni subiti: ${u.damage}`);
    const st = [!u.ready && "esausta", u.stunned && "stordita", u.buffed && "con buff (+1)", u.empowered && "potenziata", u.is_token && "token"].filter(Boolean);
    if (st.length) lines.push(st.join(", "));
    if (u.keywords && u.keywords.length) lines.push("Parole chiave attive: " + u.keywords.map((k) => KW[k] || k).join(", "));
    if (u.gear && u.gear.length) lines.push("Equipaggiata con: " + u.gear.map(esc).join(", "));
  }
  if (r.legend) lines.push(r.ready ? "Pronta" : "Esausta (già usata in questo turno)");
  if (r.runes) lines.push(`Ne hai in gioco: ${r.runes}`);
  if (r.facedown === "theirs") lines.push("Carta coperta dell'avversario");
  if (r.facedown === "mine") lines.push("La tua carta coperta");
  if (r.pile === "trash") lines.push("In cima al cimitero. Clicca per vederlo tutto.");
  const head = r.name ? `<b>${esc(r.name)}</b><div class="hint">${esc(TYPES[c.type] || c.type || "")}${c.cost != null ? " · costo " + c.cost : ""}</div>` : "";
  pv.className = "preview" + (r.wide ? " wide" : "");
  pv.innerHTML = `${r.name ? face(r.name) : back()}
    <div class="info">${head}${lines.map((l) => `<div class="st">${l}</div>`).join("")}</div>
    ${u && u.gear && u.gear.length ? `<div class="gears">${u.gear.map((g) => face(g)).join("")}</div>` : ""}`;
  pv.style.display = "block";
  const rect = el.getBoundingClientRect(), w = pv.offsetWidth, h = pv.offsetHeight;
  let left = rect.right + 14;
  if (left + w > window.innerWidth - 8) left = rect.left - w - 14;
  left = Math.max(8, left);
  const top = Math.max(8, Math.min(window.innerHeight - h - 8, rect.top + rect.height / 2 - h / 2));
  pv.style.left = left + "px"; pv.style.top = top + "px";
}
function hidePreview() { $("#preview").style.display = "none"; }
document.addEventListener("mouseover", (ev) => {
  const el = ev.target.closest("[data-ref]");
  if (el && REF[el.dataset.ref] && !$("#menubox")) showPreview(el); else hidePreview();
});

/* ---------- modal: new game, result, piles ---------- */
function renderModal() {
  const el = $("#modal");
  if (pileOpen && S.observation) {
    const o = S.observation, key = (pileOpen.who === "me" ? "my_" : "opp_") + pileOpen.pile, names = o[key] || [];
    const title = (pileOpen.pile === "trash" ? "Cimitero" : "Carte bandite") + (pileOpen.who === "me" ? " (tuo)" : " (avversario)");
    names.forEach((n, i) => REF[`pile:${i}`] = { name: n });
    el.innerHTML = `<div class="modal"><div class="box"><h2>${title} · ${names.length}</h2>
      <div class="pile">${names.map((n, i) => `<div data-ref="pile:${i}">${face(n)}</div>`).join("") || '<span class="muted">Vuoto</span>'}</div>
      <div style="margin-top:14px;text-align:right"><button class="ghost" id="closePile">Chiudi</button></div></div></div>`;
    $("#closePile").onclick = () => { pileOpen = null; renderModal(); };
    return;
  }
  const show = S.status === "idle" || (S.status === "over" && setupOpen) || (S.status === "over" && S.result && !S._seen);
  if (!show) { el.innerHTML = ""; return; }
  const r = S.result;
  const res = r ? (r.error ? `<div class="result lost">Errore: ${esc(r.error)}</div>`
    : `<div class="result ${r.you_won ? "won" : "lost"}">${r.you_won ? "Hai vinto!" : r.winner === "DRAW" ? "Pareggio" : "Hai perso"}</div>
       <p class="hint">${S.observation ? `Punteggio ${S.observation.my_points} a ${S.observation.opp_points}, ` : ""}${r.turns} turni.
       ${S.saving ? `Salvate ${S.decisions} tue decisioni, di cui ${S.corrections} diverse dal consiglio della rete: serviranno ad allenarla.` : "Partita abbandonata: non è stato salvato niente."}
       ${S.saving && S.info && S.info.finished_by_net ? " La parte finale l'ha giocata la rete da sola (quelle mosse non sono salvate)." : ""}</p>`) : "";
  const opts = (S.decks || []).map((d) => `<option value="${esc(d.path)}">${esc(d.name)}</option>`).join("");
  el.innerHTML = `<div class="modal"><div class="box">
    ${res ? res + '<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">' : ""}
    <h2>Nuova partita</h2>
    <p class="hint" style="margin-top:-4px">La rete gioca il tuo mazzo e ti chiede conferma a ogni mossa. Le tue scelte la allenano.</p>
    <div class="grid2">
      <div><label>Il tuo mazzo</label><select id="mine">${opts}</select></div>
      <div><label>Mazzo avversario</label><select id="opp">${opts}</select></div>
      <div><label>Chi è l'avversario</label><select id="vs"><option value="net">La rete</option><option value="simple_trade">Bot semplice</option></select></div>
      <div><label>Posto</label><select id="seat"><option value="A">A</option><option value="B">B</option></select></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      ${S.status === "over" ? '<button class="ghost" id="later">Guarda il tavolo</button>' : ""}<button id="start">Inizia partita</button></div>
    <p class="hint" style="margin-top:10px">Rete: ${esc(S.net || "")}</p></div></div>`;
  if ((S.decks || []).length > 1) $("#opp").selectedIndex = 1;
  $("#start").onclick = () => { setupOpen = false; post("/api/new", { deck_mine: $("#mine").value, deck_opp: $("#opp").value, seat: $("#seat").value, opponent: $("#vs").value }); };
  if ($("#later")) $("#later").onclick = () => { setupOpen = false; S._seen = true; seenResult = JSON.stringify(S.result); el.innerHTML = ""; };
}
let seenResult = null;

/* ---------- talking to the server ---------- */
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json(); if (j.error) alert(j.error); lastKey = ""; await poll(); return j;
}
async function send(answer) {
  if (busy) return; busy = true; closeMenu(); hidePreview();
  try { await post("/api/answer", answer); } finally { busy = false; }
}
$("#sendReport").onclick = async () => {
  const note = $("#note").value.trim(); if (!note) return;
  const j = await post("/api/report", { note }); if (j.ok) { $("#note").value = ""; $("#reportOk").textContent = "Salvata, grazie!"; }
};
function render() {
  if (S.status !== "waiting") focus = 0;
  if (!S.pending || S.pending.type !== "mulligan") mullSel = [];
  S._seen = seenResult === JSON.stringify(S.result);
  renderTable(); renderSide(); markTable(); renderModal();
  requestAnimationFrame(() => { squeeze(); drawArrows(); });
}
async function poll() {
  try {
    const r = await fetch("/api/state"); const s = await r.json();
    const key = JSON.stringify([s.status, s.pending, s.observation, s.board, (s.events || []).length, s.result, s.decisions, s.activity]);
    S = s;
    if (key !== lastKey) { lastKey = key; hidePreview(); render(); }
  } catch (e) { $("#status").textContent = "Server spento?"; }
}
window.addEventListener("resize", () => { if (S) { squeeze(); drawArrows(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenu(); if (pileOpen) { pileOpen = null; renderModal(); } } });
setInterval(poll, 700); poll();
</script>
</body>
